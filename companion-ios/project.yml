name: RoundDashCompanion
options:
  bundleIdPrefix: com.rounddash
  deploymentTarget:
    iOS: "16.0"
targets:
  RoundDashCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "RoundDash"
        CFBundleIdentifier: "com.rounddash.copilot"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - location
          - bluetooth-central
          - fetch
        NSLocationAlwaysAndWhenInUseUsageDescription: "RoundDash streams live road vector centerlines to your dashboard minimap display while driving."
        NSLocationWhenInUseUsageDescription: "RoundDash streams live road vector centerlines to your dashboard minimap display while driving."
        NSBluetoothAlwaysUsageDescription: "RoundDash connects to your ESP32 dashboard display over Bluetooth Low Energy."
        NSBluetoothPeripheralUsageDescription: "RoundDash connects to your ESP32 dashboard display over Bluetooth Low Energy."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rounddash.copilot
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
