name: Build iOS Companion App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: companion-ios
        run: xcodegen generate

      - name: Build iOS App
        working-directory: companion-ios
        run: |
          xcodebuild build \
            -project RoundDashCompanion.xcodeproj \
            -scheme RoundDashCompanion \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        working-directory: companion-ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/RoundDashCompanion.app Payload/
          zip -r RoundDashCompanion.ipa Payload/
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundDashCompanion-IPA
          path: companion-ios/RoundDashCompanion.ipa
          retention-days: 14
